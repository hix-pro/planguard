[package]
name = "planguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["hix-pro"]
description = "Review a Terraform plan for destructive, public, and unencrypted changes."
repository = "https://github.com/hix-pro/planguard"
homepage = "https://github.com/hix-pro/planguard"
readme = "README.md"
license = "MIT"
keywords = ["terraform", "plan", "review", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = true
